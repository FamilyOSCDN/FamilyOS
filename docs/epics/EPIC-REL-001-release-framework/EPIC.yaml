  format: MAJOR.MINOR.PATCH
  pre_release_supported: true
  release_candidate_supported: true
  candidate_format: MAJOR.MINOR.PATCH-rc.N
  immutable_published_versions: true

tagging:
  framework_tag_format: v<version>-<release-subject>
  current_intended_tag: v4.8.0-release-framework
  annotated_tags_required_for_framework_release: true
  immutable_after_publication: true
  conflicting_tag_behavior: block

validation:
  required: true
  final_document: 28-Validation.md
  evidence_document: VALIDATION.md

  required_domains:
    - structure
    - completeness
    - semantic-consistency
    - cross-references
    - control-documents
    - version
    - repository-state
    - release-readiness

  blocking_findings_allowed: 0

governance:
  release_owner_required: true
  explicit_release_approval: true
  explicit_publication_authority: true
  explicit_risk_acceptance: true
  explicit_exception_handling: true
  emergency_authority_defined: true
  framework_change_governance: true

security:
  release_credentials_in_repository: prohibited
  least_privilege: required
  tag_integrity: required
  candidate_integrity: required
  artifact_integrity: profile-dependent
  trusted_publication_identity: required

  signing:
    current_requirement: optional
    future_capability: true

  sbom:
    current_requirement: optional
    future_capability: true

  signed_provenance:
    current_requirement: optional
    future_capability: true

automation:
  current_maturity: manual-governed
  manual_release_supported: true
  automated_readiness: roadmap
  automated_candidate_creation: roadmap
  release_manifest: roadmap
  policy_as_code: roadmap
  release_orchestrator: roadmap
  automated_multi_target_publication: roadmap
  automated_recovery: roadmap

current_implementation:
  framework_documentation: required
  manual_validation: required
  git_release_workflow: required
  annotated_tagging: required
  remote_publication_verification: required
  full_release_orchestrator: deferred
  mandatory_artifact_signing: deferred
  mandatory_sbom: deferred
  mandatory_signed_provenance: deferred

