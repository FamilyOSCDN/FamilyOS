name: Canonical CI Validation

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FamilyOS without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run canonical CI validation
        id: canonical_validation
        continue-on-error: true
        run: familyos validation ci --output ci-validation.json

      - name: Upload canonical validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-ci-validation
          path: ci-validation.json
          if-no-files-found: error

      - name: Preserve canonical validation result
        if: always() && steps.canonical_validation.outcome != 'success'
        run: exit 1

      - name: Run canonical package build
        id: canonical_package_build
        run: >-
          familyos build
          --profile ci
          --output-dir dist
          --evidence-output build-evidence.json

      - name: Upload canonical Build Evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-build-evidence
          path: build-evidence.json
          if-no-files-found: error

      - name: Upload package candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-package-candidates
          path: dist/
          if-no-files-found: error

  cache-free-validation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13 without cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies without cache
        run: python -m pip install --no-cache-dir -r requirements.txt

      - name: Install FamilyOS without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run canonical CI validation
        run: familyos validation ci --output ci-validation.json

      - name: Run canonical package build
        run: >-
          familyos build
          --profile ci
          --output-dir dist
          --evidence-output build-evidence.json
