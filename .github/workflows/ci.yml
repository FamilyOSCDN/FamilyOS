name: Canonical CI Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt

      - name: Install FamilyOS without dependency resolution
        run: python -m pip install --no-deps --no-build-isolation -e .

      - name: Run canonical CI validation
        id: canonical_validation
        continue-on-error: true
        run: familyos validation ci --output ci-validation.json

      - name: Upload canonical validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: familyos-ci-validation
          path: ci-validation.json
          if-no-files-found: error

      - name: Preserve canonical validation result
        if: always() && steps.canonical_validation.outcome != 'success'
        run: exit 1
